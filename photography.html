<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography | ALT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a1428;
            --card: #13213d;
            --accent: #00d4ff;
            --text: #e0f2fe;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            line-height: 1.6;
        }
        header {
            padding: 1.5rem 5%;
            background: rgba(10, 20, 40, 0.95);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
        h1 { text-align: center; margin: 3rem 0 2rem; color: var(--accent); font-size: 2.8rem; }
        .content {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 5%;
            text-align: center;
        }
        .back-btn {
            display: inline-block;
            margin: 2rem 5%;
            padding: 12px 28px;
            background: var(--accent);
            color: #000;
            text-decoration: none;
            font-weight: 600;
            border-radius: 50px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">ALT's Portfolio</div>
    </header>
    
    <h1>Photography</h1>
    <div class="content">
        <p>Capturing photos, Saving memories.</p>
        <p>My personal photography portfolio for videogame Photography. I enjoy capturing any cool seeming photos ingame, and then adding them to this website.</p>
        
        <p style="margin-top: 4rem; opacity: 0.7;">Gallery coming soon...</p>
    </div>

    <a href="index.html" class="back-btn">← Return to Portfolio</a>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Bots | ALT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a1428;
            --card: #13213d;
            --accent: #00d4ff;
            --text: #e0f2fe;
        }
        [data-theme="light"] {
            --bg: #f8fafc;
            --card: #e2e8f0;
            --accent: #0077b6;
            --text: #1e2937;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            line-height: 1.6;
            transition: all 0.4s ease;
        }
        header {
            padding: 1.5rem 5%;
            background: rgba(10, 20, 40, 0.95);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        [data-theme="light"] header {
            background: rgba(248, 250, 252, 0.95);
        }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
        .theme-toggle {
            background: none;
            border: 2px solid var(--accent);
            color: var(--accent);
            width: 42px; height: 42px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1 { text-align: center; margin: 3rem 0 2rem; color: var(--accent); font-size: 2.8rem; }
        .content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 5%;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin: 3rem 0;
        }
        .gallery img {
            width: 100%;
            border-radius: 12px;
            border: 3px solid var(--accent);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
            transition: transform 0.3s ease;
        }
        .gallery img:hover {
            transform: scale(1.05);
        }
        .back-btn {
            display: inline-block;
            margin: 3rem 5%;
            padding: 12px 28px;
            background: var(--accent);
            color: #000;
            text-decoration: none;
            font-weight: 600;
            border-radius: 50px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">ALT's Portfolio</div>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle Theme">🌙</button>
    </header>
    
    <h1>Community Bots</h1>

    <a href="index.html" class="back-btn">← Return to Portfolio</a>

    <script>
        // Theme Toggle
        const toggleBtn = document.getElementById('themeToggle');
        toggleBtn.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            toggleBtn.textContent = isDark ? '☀️' : '🌙';
        });
    </script>

                            <tr>

                            <li>URL: <code>https://api.cookie-api.com/api/roblox/user?username={{arg('rblx_username')}}</code></li>
                            <li>Headers:</li>
                        </ul>
                    </ul>

                    <table>
                        <thead>
                            <tr><th>Key</th><th>Value</th></tr>
                        </thead>
                        <tbody>
                            <tr><td><strong>Authorization</strong></td><td><code>[Your cookie API key!]</code></td></tr>
                            <tr><td><strong>username</strong></td><td><code>{{arg('rblx_username')}}</code></td></tr>
                        </tbody>
                    </table>

                    <ul>
                        <li>Set the temporary value of the API block to be <code>api</code>.</li>
                    </ul>

                    <p><strong>Listed below are the ways to get the certain information:</strong></p>
                    <ul>
                        <li><code>{{fromJSON(var('api').body()).username}}</code> - <em>Will output the roblox username</em></li>
                        <li><code>https://www.roblox.com/users/{{fromJSON(var('api').body()).userid}}/profile</code> - <em>Will output a link to the users profile.</em></li>
                        <li><code>{{fromJSON(var('api').body()).userid}}</code> - <em>Will output the user's ID.</em></li>
                        <li><code>{{ fromJSON(var('api').body()).has_verified_badge ? "User is verified.." : "User is not verified." }}</code> - <em>Will output a different response depending on if the user has the verified badge.</em></li>
                        <li><code>{{ fromJSON(var('api').body()).is_banned ? "User is banned." : "User is not banned." }}</code> - <em>Will output a different response based on if the user is banned from roblox or not.</em></li>
                        <li><code>{{fromJSON(var('api').body()).description}}</code> - <em>Will output the user's roblox description.</em></li>
                        <li><code>{{fromJSON(var('api').body()).user_avatar_picture}}</code> - <em>Will get the avatar picture of the roblox avatar.</em></li>
                    </ul>`
                },
                { id: "roblox-verification-api", title: "Roblox Verification", category: "API's", content: "<h1>Roblox Verification API</h1><p>Data links linking tokens safely across integrated services channels.</p>" }
            ]
        };

        let currentTab = 'info';

        // Render dynamic menu tree
        function renderSidebar() {
            const sidebar = document.getElementById('sidebar-menu');
            sidebar.innerHTML = '';

            const categories = {};
            siteData.pages.forEach(page => {
                if (!categories[page.category]) categories[page.category] = [];
                categories[page.category].push(page);
            });

            for (const category in categories) {
                if (category !== "General") {
                    const catHeader = document.createElement('div');
                    catHeader.className = 'sidebar-category';
                    catHeader.innerText = category;
                    sidebar.appendChild(catHeader);
                }

                categories[category].forEach(page => {
                    const item = document.createElement('div');
                    item.className = `nav-item ${currentTab === page.id ? 'active' : ''}`;
                    item.innerText = page.title;
                    item.onclick = () => loadPage(page.id);
                    sidebar.appendChild(item);
                });
            }
        }

        // Handle page rendering transitions
        function loadPage(id) {
            currentTab = id;
            renderSidebar();
            const pane = document.getElementById('content-pane');

            const page = siteData.pages.find(p => p.id === id);
            if (page) {
                pane.innerHTML = `
                    <div class="breadcrumbs">🏠 &nbsp;›&nbsp; ${page.category} &nbsp;›&nbsp; ${page.title}</div>
                    ${page.content}
                `;
            }
        }

        // Live Light / Dark Mode Toggle Button Logic
        const themeToggleBtn = document.getElementById('themeToggle');
        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
            
            if (document.body.classList.contains('light-theme')) {
                themeToggleBtn.textContent = '☀️';
            } else {
                themeToggleBtn.textContent = '🌙';
            }
        });

        // Initialize view life cycle
        loadPage('info');
    </script>
</body>
</html>

<body class="bg-[#0b0f19] text-slate-200 antialiased selection:bg-amber-500/30 selection:text-amber-200">

    <script>
        // Paste your Discord Application Client ID here
        const CLIENT_ID = '1508284859200573572'; 
        // Paste your exact saved Redirect URI here
        const REDIRECT_URI = encodeURIComponent('https://alt10fd0f.github.io/'); 
        // Paste your Discord Log Webhook URL here
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1459289585900191886/VbEJjul0hu7dJZIUHPhYil-5BGeEfhl066Uub4zAz63iCFFpLleJiYJGGes6BggxMX0-'; 
    </script>

    <div id="authGate" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#0b0f19]">
        <div class="w-full max-w-md rounded-2xl border border-slate-800 bg-[#0f1524] p-8 text-center space-y-6 shadow-2xl">
            <img src="https://cdn.discordapp.com/attachments/1371589950231019702/1501035709774037052/IraVIAAAAGSURBVAMAFsiJkEbiFJMAAAAASUVORK5CYII.png?ex=6a145131&is=6a12ffb1&hm=ebe43bb8b9b27d986936bf11cc1b12bdf8133d8aef9f9255ae6d90d04a942617&animated=true" 
                 class="mx-auto h-16 w-16 rounded-full border border-amber-500/30 shadow-xl shadow-amber-500/10">
            <div>
                <h2 class="text-2xl font-extrabold text-white">FSRP Staff Portal</h2>
                <p class="text-xs text-slate-400 mt-1">Secure identity verification required via Discord</p>
            </div>
            <button onclick="redirectToDiscord()" class="w-full flex items-center justify-center gap-3 bg-[#5865F2] hover:bg-[#4752C4] text-white font-bold text-sm uppercase tracking-wider py-3.5 rounded-lg transition-all shadow-lg shadow-indigo-500/10">
                <i class="fa-brands fa-discord text-lg"></i> Verify with Discord
            </button>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <header class="sticky top-0 z-40 w-full border-b border-slate-800 bg-[#0b0f19]/80 backdrop-blur-md">
            <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
                <div class="flex items-center gap-3">
                    <img src="https://cdn.discordapp.com/attachments/1371589950231019702/1501035709774037052/IraVIAAAAGSURBVAMAFsiJkEbiFJMAAAAASUVORK5CYII.png?ex=6a145131&is=6a12ffb1&hm=ebe43bb8b9b27d986936bf11cc1b12bdf8133d8aef9f9255ae6d90d04a942617&animated=true" 
                         alt="FSRP Logo" class="h-9 w-9 rounded-full border border-amber-500/30">
                    <div>
                        <span class="text-sm font-semibold tracking-wider text-amber-500">FLORIDA STATE RP</span>
                        <p class="text-xs font-medium text-slate-400" id="userWelcome">Loading profile...</p>
                    </div>
                </div>
                <button onclick="logout()" class="text-xs text-slate-400 hover:text-red-400 font-medium bg-slate-800/40 border border-slate-800 px-3 py-1.5 rounded-lg transition-all">
                    Sign Out
                </button>
            </div>
        </header>

        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col lg:flex-row gap-8 py-8">
                </div>
        </div>
    </div>

    <script>
        // Redirect user out to Discord identity confirmation prompt
        function redirectToDiscord() {
            window.location.href = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${REDIRECT_URI}&scope=identify`;
        }

        // Run validation actions automatically on window asset compilation loads
        window.onload = function() {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            let accessToken = fragment.get('access_token');

            // If token is found in URL, save it to browser session and clean the address bar URL
            if (accessToken) {
                sessionStorage.setItem('discord_token', accessToken);
                window.location.hash = ''; 
            } else {
                accessToken = sessionStorage.getItem('discord_token');
            }

            // If token is validated internally, request user profile data arrays
            if (accessToken) {
                fetchUserData(accessToken);
            }
        };

        function fetchUserData(token) {
            fetch('https://discord.com/api/users/@me', {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(res => {
                if (!res.ok) throw new Error('Expired Token');
                return res.json();
            })
            .then(user => {
                // Display profile greeting inside header viewport elements
                document.getElementById('userWelcome').innerText = `Logged in as ${user.username}`;
                
                // Drop out login panel screen blocking layer masks
                document.getElementById('authGate').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');

                // Fire tracking webhook message logging trace logs out to server channels
                logVisitToWebhook(user);
            })
            .catch(err => {
                console.error(err);
                sessionStorage.removeItem('discord_token');
            });
        }

        function logVisitToWebhook(user) {
            // Check if we've already logged this session visit tracking state 
            if (sessionStorage.getItem('logged_visit') === 'true') return;

            const payload = {
                username: "FSRP Security Bot",
                avatar_url: "https://cdn.discordapp.com/attachments/1371589950231019702/1501035709774037052/IraVIAAAAGSURBVAMAFsiJkEbiFJMAAAAASUVORK5CYII.png",
                embeds: [{
                    title: "🔒 Documentation Portal Access Log",
                    color: 16753920, // Amber color code
                    fields: [
                        { name: "Discord Account", value: `**${user.username}**`, inline: true },
                        { name: "User ID", value: `\`${user.id}\``, inline: true },
                        { name: "Timestamp", value: `<t:${Math.floor(Date.now() / 1000)}:F>`, inline: false }
                    ],
                    footer: { text: "FSRP Automated Audit Logs" }
                }]
            };

            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                sessionStorage.setItem('logged_visit', 'true');
            })
            .catch(err => console.error('Logging pipeline failure:', err));
        }

        function logout() {
            sessionStorage.clear();
            window.location.reload();
        }

        // Your exact switchTab() and toggleDropdown() functional execution statements stay here...
        function switchTab(tabId) {
            const views = document.querySelectorAll('.page-content');
            views.forEach(v => v.classList.add('hidden'));
            const tabBtns = document.querySelectorAll('.tab-btn');
            tabBtns.forEach(b => {
                b.classList.remove('bg-slate-800', 'text-white');
                b.classList.add('text-slate-400', 'hover:bg-slate-800/50');
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`btn-${tabId}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-slate-400', 'hover:bg-slate-800/50');
                activeBtn.classList.add('bg-slate-800', 'text-white');
            }
        }

        function toggleDropdown() {
            const dropdown = document.getElementById('whitelistDropdown');
            const arrow = document.getElementById('dropdownArrow');
            if (dropdown.classList.contains('hidden')) {
                dropdown.classList.remove('hidden');
                arrow.classList.add('rotate-180');
            } else {
                dropdown.classList.add('hidden');
                arrow.classList.remove('rotate-180');
            }
        }
    </script>
</body>

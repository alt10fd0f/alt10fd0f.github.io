<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALT10fd0f. Tutorial</title>
    <link id="favicon" rel="icon" type="image/x-icon" href="https://kite.onl/_next/static/media/orange@1024.d4cfa116.png">
    
    <style>
        :root {
            /* Dark Mode Design Tokens (Default) */
            --bg-main: #121214;
            --bg-sidebar: #18181c;
            --bg-hover: #232329;
            --text-main: #e4e4e7;
            --text-muted: #a1a1aa;
            --accent: #2dd4bf;
            --border: #27272a;
            --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body.light-theme {
            /* Light Mode Design Tokens */
            --bg-main: #f4f4f5;
            --bg-sidebar: #ffffff;
            --bg-hover: #f1f1f4;
            --text-main: #18181b;
            --text-muted: #71717a;
            --accent: #0d9488;
            --border: #e4e4e7;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        header {
            background-color: var(--bg-sidebar);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            height: 60px;
            z-index: 10;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .logo-area { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-weight: 700; 
            font-size: 1.1rem; 
        }
        .logo-icon { color: var(--accent); }
        .logo-sub { color: var(--text-muted); font-weight: 400; font-size: 0.95rem; margin-left: 4px; }
        
        .nav-links { 
            display: flex; 
            align-items: center; 
            gap: 24px; 
            font-size: 0.95rem; 
            font-weight: 500; 
        }
        .nav-links a { 
            color: var(--text-muted); 
            text-decoration: none; 
            cursor: pointer; 
            transition: color 0.2s ease;
        }
        .nav-links a:hover { color: var(--text-main); }
        
        .theme-toggle-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: transform 0.1s ease;
        }
        .theme-toggle-btn:active { transform: scale(0.9); }

        .wrapper { display: flex; flex: 1; overflow: hidden; }

        /* Left Navigation Menu */
        .left-sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            padding: 24px 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .nav-item {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.92rem;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.1s ease, color 0.1s ease;
        }

        .nav-item:hover { background-color: var(--bg-hover); color: var(--text-main); }
        .nav-item.active { color: var(--accent); background-color: rgba(45, 212, 191, 0.08); font-weight: 600; }
        body.light-theme .nav-item.active { background-color: rgba(13, 148, 136, 0.08); }
        
        .sidebar-category { 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            color: var(--text-main); 
            margin: 16px 0 6px 12px; 
            font-weight: 700; 
            opacity: 0.8;
        }

        /* Documentation Workspaces */
        .main-content { flex: 1; padding: 40px 48px; overflow-y: auto; max-width: 800px; margin: 0 auto; width: 100%; }
        .breadcrumbs { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 24px; }
        h1 { font-size: 2.5rem; margin-top: 0; margin-bottom: 1.5rem; letter-spacing: -0.02em; }
        h2 { font-size: 1.75rem; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-top: 2rem; }
        p { line-height: 1.7; color: var(--text-main); margin-bottom: 1.25rem; }

        /* Right Table of Contents Pane */
        .right-sidebar { width: 220px; padding: 40px 24px; font-size: 0.85rem; border-left: 1px solid var(--border); overflow-y: auto; }
        .toc-title { font-weight: 600; margin-bottom: 12px; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; color: var(--text-muted); }
        .toc-links { display: flex; flex-direction: column; gap: 10px; color: var(--text-muted); }
        .toc-links a { text-decoration: none; color: inherit; }
        .toc-links a:hover { color: var(--text-main); }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <span class="logo-icon">🤖</span> ALT10fd0f. <span class="logo-sub">Tutorial</span>
        </div>
        <div class="nav-links">
            <a onclick="loadPage('info')">Info</a>
            <button id="themeToggle" class="theme-toggle-btn">🌙</button>
        </div>
    </header>

    <div class="wrapper">
        <aside class="left-sidebar" id="sidebar-menu"></aside>

        <main class="main-content" id="content-pane"></main>

        <aside class="right-sidebar">
            <div class="toc-title">On This Page</div>
            <div class="toc-links">
                <a href="#">Overview</a>
                <a href="#">Setup Parameters</a>
                <a href="#">Runtime Syntax</a>
            </div>
        </aside>
    </div>

    <script>
        // Static Site Structure
        const siteData = {
            pages: [
                { id: "info", title: "Information", category: "General", content: "<h1>Information Hub</h1><p>Welcome to the official <strong>ALT10fd0f. Tutorial</strong> workspace. Choose any system module configuration from the sidebar left hierarchy to view targeted implementation examples and configuration structures.</p>" },
                
                // Basic Commands
                { id: "say", title: "Say", category: "Basic Commands", content: "<h1>Say Command</h1><p>Documentation details for custom message broadcasting layouts.</p>" },
                { id: "dm", title: "DM", category: "Basic Commands", content: "<h1>DM Command</h1><p>Configuration rules mapping localized direct user warning parameters.</p>" },
                { id: "user-info", title: "User Info", category: "Basic Commands", content: "<h1>User Info</h1><p>Data structures outputting data markers registered to target objects.</p>" },
                { id: "modal-form", title: "Modal/Form", category: "Basic Commands", content: "<h1>Modal/Form</h1><p>UI block parameters managing client interactive fields.</p>" },
                { id: "prefix-commands", title: "Prefix Commands", category: "Basic Commands", content: "<h1>Prefix Commands</h1><p>Parsing syntax evaluating legacy string call commands.</p>" },
                
                // Fun Commands
                { id: "clicker-game", title: "Clicker Game", category: "Fun Commands", content: "<h1>Clicker Game</h1><p>State logic loops processing client event triggers dynamically.</p>" },
                { id: "calculator-command", title: "Calculator Command", category: "Fun Commands", content: "<h1>Calculator Command</h1><p>Computational syntax evaluations processing raw input strings.</p>" },
                { id: "discord-mod-panel", title: "Discord Mod Panel", category: "Fun Commands", content: "<h1>Discord Mod Panel</h1><p>Moderation layout views tracking server environment restrictions.</p>" },
                { id: "password-setup", title: "Password Setup", category: "Fun Commands", content: "<h1>Password Setup</h1><p>String validation mechanics controlling access checkpoints.</p>" },

                // Important Commands
                { id: "ticket-setup", title: "Ticket Setup", category: "Important Commands", content: "<h1>Ticket Setup</h1><p>Procedures initiating isolated text support threads.</p>" },
                { id: "application-setup", title: "Application Setup", category: "Important Commands", content: "<h1>Application Setup</h1><p>Forms pipelines routing staff submission records across active webhooks.</p>" },
                { id: "roblox-verification", title: "Roblox Verification", category: "Important Commands", content: "<h1>Roblox Verification</h1><p>Step-by-step documentation detailing account verification rules.</p>" },
                { id: "erlc-session-management", title: "ER:LC Session Management", category: "Important Commands", content: "<h1>ER:LC Session Management</h1><p>System tools processing custom log parameters for active servers.</p>" },

                // API's
                { id: "member-count", title: "Member Count", category: "API's", content: "<h1>Member Count</h1><p>API endpoints indexing server volume totals cleanly.</p>" },
                { id: "erlc-api-v2", title: "ER:LC API V2", category: "API's", content: "<h1>ER:LC API V2</h1><p>Advanced routing examples interacting with server state protocols.</p>" },
                { id: "ticket-transcripts", title: "Ticket Transcripts", category: "API's", content: "<h1>Ticket Transcripts</h1><p>Methods exporting text channel structures into historical document files.</p>" },
                { id: "roblox-user-lookup", title: "Roblox User Lookup", category: "API's", content: "<h1>Roblox User Lookup</h1><p>Call parameters checking user registration arrays by string identifier signatures.</p>" },
                { id: "roblox-verification-api", title: "Roblox Verification", category: "API's", content: "<h1>Roblox Verification API</h1><p>Data links linking tokens safely across integrated services channels.</p>" }
            ]
        };

        let currentTab = 'info';

        // Render dynamic menu tree
        function renderSidebar() {
            const sidebar = document.getElementById('sidebar-menu');
            sidebar.innerHTML = '';

            const categories = {};
            siteData.pages.forEach(page => {
                if (!categories[page.category]) categories[page.category] = [];
                categories[page.category].push(page);
            });

            for (const category in categories) {
                if (category !== "General") {
                    const catHeader = document.createElement('div');
                    catHeader.className = 'sidebar-category';
                    catHeader.innerText = category;
                    sidebar.appendChild(catHeader);
                }

                categories[category].forEach(page => {
                    const item = document.createElement('div');
                    item.className = `nav-item ${currentTab === page.id ? 'active' : ''}`;
                    item.innerText = page.title;
                    item.onclick = () => loadPage(page.id);
                    sidebar.appendChild(item);
                });
            }
        }

        // Handle page rendering transitions
        function loadPage(id) {
            currentTab = id;
            renderSidebar();
            const pane = document.getElementById('content-pane');

            const page = siteData.pages.find(p => p.id === id);
            if (page) {
                pane.innerHTML = `
                    <div class="breadcrumbs">🏠 &nbsp;›&nbsp; ${page.category} &nbsp;›&nbsp; ${page.title}</div>
                    ${page.content}
                `;
            }
        }

        // Live Light / Dark Mode Toggle Button Logic
        const themeToggleBtn = document.getElementById('themeToggle');
        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
            
            if (document.body.classList.contains('light-theme')) {
                themeToggleBtn.textContent = '☀️';
            } else {
                themeToggleBtn.textContent = '🌙';
            }
        });

        // Initialize view life cycle
        loadPage('info');
    </script>
</body>
</html>
